[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
    "@openzeppelin/contracts-upgradeable/=node_modules/@openzeppelin/contracts-upgradeable/",
    "forge-std/=lib/forge-std/src/"
]

[profile.test]
optimizer_runs = 0

[profile.fuzzing]
optimizer_runs = 0

[fuzz]
runs = 10000

[fmt]
line_length = 100
tab_width = 4

[etherscan]
# Chain-specific etherscan APIs can be configured here
mainnet = { key = "${ETHERSCAN_API_KEY}" }
sepolia = { key = "${ETHERSCAN_API_KEY}" }
